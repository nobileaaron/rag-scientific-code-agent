# LiteLLM proxy config that exposes local Ollama models through an
# Anthropic-compatible /v1/messages endpoint so Claude Code can drive them.
#
# Start with:  litellm --config litellm_ollama_config.yaml --port 4000
# (run_eval_ssh.sh does this for you.)
#
# IMPORTANT: the `model:` tags below must match models that exist in your
# local Ollama install (`ollama list`). Adjust the tags if yours differ.
# `num_ctx` sets the Ollama context window — keep it large enough to hold
# Claude Code's system prompt + tool schemas + the files the model reads.

litellm_settings:
  # Claude Code sends Anthropic-shaped params that Ollama doesn't understand.
  # Dropping unknown params keeps the proxy from 400-ing on them.
  drop_params: true
  # Keep the proxy quiet about provider quirks.
  set_verbose: false

model_list:
  - model_name: claude-qwen25-7b-q4km
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b-instruct-q4_K_M
      api_base: http://localhost:11434
      num_ctx: 32768
      # Local models can't do extended thinking; strip it so the Anthropic
      # /v1/messages pass-through never forwards `thinking` to Ollama.
      thinking: null
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  - model_name: claude-qwen25-32b-q4km
    litellm_params:
      model: ollama_chat/qwen2.5-coder:32b-instruct-q4_K_M
      api_base: http://localhost:11434
      num_ctx: 32768
      # Local models can't do extended thinking; strip it so the Anthropic
      # /v1/messages pass-through never forwards `thinking` to Ollama.
      thinking: null
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  - model_name: claude-qwen35-9b
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://localhost:11434
      num_ctx: 32768
      # Local models can't do extended thinking; strip it so the Anthropic
      # /v1/messages pass-through never forwards `thinking` to Ollama.
      thinking: null
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  - model_name: claude-gemma4-12b
    litellm_params:
      model: ollama_chat/gemma4:12b
      api_base: http://localhost:11434
      num_ctx: 32768
      # Local models can't do extended thinking; strip it so the Anthropic
      # /v1/messages pass-through never forwards `thinking` to Ollama.
      thinking: null
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

general_settings:
  master_key: sk-local
